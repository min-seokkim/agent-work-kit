name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
      - name: Commit author and trailers match the repository's history
        if: github.event_name == 'push'
        env:
          PYTHONPATH: src
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"; else range="HEAD~1..HEAD"; fi
          for rev in $(git rev-list --no-merges "$range"); do
            python -m awkit check commit --rev "$rev" || exit 1
          done

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: Build and smoke-test the wheel
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release files
        run: |
          python -m pip install "setuptools>=77" wheel
          python scripts/build_release.py dist
      - name: Install into a clean environment and run the quick start
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\venv"
          $awkit = "$env:RUNNER_TEMP\venv\Scripts\awkit.exe"
          & "$env:RUNNER_TEMP\venv\Scripts\python" -m pip install --no-index --no-deps (Get-Item dist\*.whl).FullName
          $project = "$env:RUNNER_TEMP\project"
          New-Item -ItemType Directory $project | Out-Null
          & $awkit kit init $project
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item examples\local-release\* $project
          & $awkit pipeline --config "$project\pipeline.toml" deploy aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $awkit pipeline --config "$project\pipeline.toml" status
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $example = "$env:RUNNER_TEMP\data-example"
          & $awkit kit example data $example
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $awkit review --repo $example check HEAD --config "$example\checks.toml"
          if ($LASTEXITCODE -ne 1) { Write-Error "the unfixed example must fail"; exit 1 }
          (Get-Content "$example\input\orders.csv") -replace '^date,item,qty,', 'date,item,quantity,' | Set-Content "$example\input\orders.csv"
          $snap = & $awkit review --repo $example snapshot input/orders.csv
          & $awkit review --repo $example check $snap --config "$example\checks.toml"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
