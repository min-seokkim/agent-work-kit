name: release

# Push a tag such as v0.2.0 to publish the wheel and the agent-work-kit ZIP as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import awkit; print(awkit.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest discover -s tests
      - name: Build release files
        run: |
          python -m pip install "setuptools>=77" wheel
          python scripts/build_release.py dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
