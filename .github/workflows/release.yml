name: release

# Push a tag such as v0.3.0 to publish the wheel and the agent-work-kit ZIP as a GitHub release
# and the wheel on PyPI. PyPI publishing uses a trusted publisher: register this repository,
# this workflow file and the `pypi` environment on PyPI once before the first tag (docs/development.md#release).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import awkit; print(awkit.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest discover -s tests
      - name: Build release files
        run: |
          python -m pip install "setuptools>=77" wheel
          python scripts/build_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Keep only the wheel for PyPI
        run: mkdir pypi && mv dist/*.whl pypi/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/
