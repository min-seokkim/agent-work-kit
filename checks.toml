# Checks for `awkit review check` in this repository: the same commands as CI's test and lint jobs,
# run on a snapshot in a separate worktree with the snapshot's own source on PYTHONPATH.
schema = 1
timeout_seconds = 900

[env]
PYTHONPATH = "{worktree}/src"
PYTHONUTF8 = "1"

[[checks]]
name = "ruff"
argv = ["ruff", "check", "."]

[[checks]]
name = "unittest"
argv = ["{python}", "-m", "unittest", "discover", "-s", "tests"]

# Agent Work Kit: what finishing means in this repository (AGENTS.md, "Checks before pushing").
[kit]
version = "0.3.0"
done = "The change is pushed to dev, its snapshot passed `awkit review check` with this file, and CI is green on Windows and Linux."
recipient = "the owner, through commits on dev"
records = "docs/development.md"
