schema = 1
timeout_seconds = 120

# Validate a configuration file from a subdirectory, then retain the checked bytes.
# Run against an Agent Work Kit snapshot containing examples/review/.
artifacts = ["examples/review/checks.toml"]
required_artifacts = ["examples/review/checks.toml"]

[[checks]]
name = "validate-config"
cwd = "examples/review"
argv = ["{python}", "-c", """
import tomllib
from pathlib import Path

config = tomllib.loads(Path("checks.toml").read_text(encoding="utf-8"))
assert config["schema"] == 1 and config["checks"]
print("checks.toml is valid; the runner retains it under artifacts/")
"""]
