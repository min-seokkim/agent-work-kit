# The rules of the kit's default bundle that read the session rather than one tool call: the user's request,
# the final reply and the kit version. `awkit kit hooks` writes them into the draft rules.toml after the rules
# in rules.toml, and `awkit hook --kit-rules` reads the two files as one; this file holds only [[rules]] tables.

# A request for text that leaves the conversation: a prompt for another session, a document, a report. The
# user's words only add a line; they never refuse anything.
[[rules]]
name = "writing-request"
prevents = ["F14"]
kind = "inject"
events = ["UserPromptSubmit"]
prompt = '(?i)지시문|프롬프트|문서|보고서|작성|써\s*(줘|주세요|달라)|\b(write|draft)\b.{0,40}\b(prompt|instructions|document|report)'
message = "Text that leaves the conversation follows the whole writing guide. Read the awkit-writing skill or {kit}/writing.md, and {kit}/korean-writing.md for Korean, first."

# A long Korean reply shaped like a document (a heading, or a turn that asked for a document), written in a
# session that never read the writing guide. Writing can end in the chat with no tool call, so this rule
# reads the result instead of a tool call. `--hangul` is the number of Hangul syllables above which a reply
# counts as long.
[[rules]]
name = "writing-reply"
prevents = ["F14"]
kind = "verify"
events = ["Stop"]
command_protocol = "awkit-v1"
command = ["{python}", "-m", "awkit.rule_command", "hook", "reply", "--hangul", "500"]
message = "답글이 다른 곳에 쓰일 한국어 문서인데 작성 가이드를 읽지 않았다. 가이드의 과정대로 다시 쓰고 한국어만 따로 읽어라."

# The kit version checks.toml records ([kit] version), against the awkit installed here. Without the key the
# command prints nothing.
[[rules]]
name = "kit-version"
prevents = ["F25"]
kind = "inject"
events = ["SessionStart"]
command_protocol = "awkit-v1"
command = ["{python}", "-m", "awkit.rule_command", "hook", "kit-version"]
