[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-work-kit"
version = "0.3.0"
description = "Working instructions, writing guides, and verification tools for development with coding agents"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "kit/THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]

[project.optional-dependencies]
ui = ["playwright>=1.48,<2"]

[project.scripts]
awkit = "awkit.cli:main"

[tool.setuptools]
# The kit lives at the repository root so it can be browsed and copied as-is;
# the wheel ships it as awkit/kit so `awkit kit init` works after installation.
packages = ["awkit", "awkit.extras", "awkit.kit", "awkit.kit.templates", "awkit.kit.templates.roles", "awkit.kit.examples",
            "awkit.examples", "awkit.examples.documents", "awkit.examples.data", "awkit.examples.analysis"]

[tool.setuptools.package-dir]
"" = "src"
"awkit.kit" = "kit"
"awkit.examples" = "examples/first-run"

[tool.setuptools.package-data]
"awkit.kit" = ["*.md", "*.toml"]
"awkit.kit.templates" = ["*.md"]
"awkit.kit.templates.roles" = ["*.md"]
"awkit.kit.examples" = ["*.md"]
"awkit.examples.documents" = ["*.md", "*.toml", "docs/*.md"]
"awkit.examples.data" = ["*.md", "*.toml", "input/*.csv"]
"awkit.examples.analysis" = ["*.md", "*.toml", "input/*.csv"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long lines are tolerated for now; the first pass covers errors, imports and modern syntax.
ignore = ["E501"]
